name: Test AWS Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-aws:
    name: Test AWS Credentials
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Test AWS CLI
        run: |
          aws sts get-caller-identity
          echo "✅ AWS credentials work!"

      - name: List working directory
        run: |
          pwd
          ls -la
          echo "---"
          echo "Checking for Terraform files:"
          ls -la *.tf || true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform version
        run: terraform version

      - name: Terraform init (dry run)
        run: |
          echo "Current directory contents:"
          ls -la
          echo "---"
          echo "Running terraform init..."
          terraform init || echo "❌ Init failed"
          
      - name: Show Terraform files
        run: |
          echo "Main Terraform files:"
          ls -la *.tf 2>/dev/null || echo "No .tf files found"
          echo "---"
          echo "Terraform directory:"
          ls -la .terraform/ 2>/dev/null || echo "No .terraform directory"
